version: 2
updates:
  # One cargo workspace, one root lockfile, so a single `/` entry covers
  # zb_cli, zb_core and zb_io.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps arrive as one pull request per week. Major bumps
      # stay ungrouped so each one gets reviewed on its own.
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
