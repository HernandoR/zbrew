version: 2
updates:
  # One cargo workspace, one root lockfile, so a single `/` entry covers
  # zb_core, zb_extract, zb_store, zb_net, zb_installer and zb_cli.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps arrive as one pull request per week. Major bumps
      # stay ungrouped so each one gets reviewed on its own.
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # The site under site/ is Hugo now. It has no npm lockfile, so there is no
  # npm ecosystem entry here — that entry existed only for the Eleventy site,
  # whose pnpm lockfile carried every open Dependabot alert on this repository
  # (55 at the time of writing, all npm, none cargo).
