name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must be an existing tag, e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    if: github.repository == 'HernandoR/zerobrew'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: zb-darwin-arm64
            zbx_artifact_name: zbx-darwin-arm64
            use_cross: false

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: zb-darwin-x64
            zbx_artifact_name: zbx-darwin-x64
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: zb-linux-x64
            zbx_artifact_name: zbx-linux-x64
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: zb-linux-arm64
            zbx_artifact_name: zbx-linux-arm64
            use_cross: false

          # Statically linked musl builds. The glibc binaries above are built
          # against the runner's glibc (2.35) and will not start on older
          # distributions or on containers such as Google Colab; these have no
          # libc dependency at all. See issue #10.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            artifact_name: zb-linux-x64-musl
            zbx_artifact_name: zbx-linux-x64-musl
            use_cross: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            artifact_name: zb-linux-arm64-musl
            zbx_artifact_name: zbx-linux-arm64-musl
            use_cross: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # `cross` runs cargo inside a container that already carries the musl
      # cross toolchain, so the C dependencies (aws-lc-sys, rusqlite, lzma,
      # zstd) link against musl rather than the runner's glibc.
      - name: Build release binary (cross)
        if: matrix.use_cross
        env:
          CROSS_BUILD_ENV_PASSTHROUGH: LZMA_API_STATIC
          LZMA_API_STATIC: "1"
        run: cross build --release --locked --target ${{ matrix.target }} --package zb_cli

      # A static binary has no PT_INTERP segment. readelf works for both musl
      # targets from the x86_64 runner, unlike ldd, and unlike `file` it does
      # not report static-pie executables as dynamically linked.
      - name: Verify musl binaries are statically linked
        if: matrix.use_cross
        run: |
          set -euo pipefail
          for bin in zb zbx; do
            path="target/${{ matrix.target }}/release/$bin"
            if readelf -l "$path" | grep -q INTERP; then
              echo "error: $path is dynamically linked"
              readelf -l "$path"
              exit 1
            fi
          done

      - name: Build release binary
        if: '!matrix.use_cross'
        env:
          LZMA_API_STATIC: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --locked --target ${{ matrix.target }} --package zb_cli

      - name: Verify no dynamic liblzma dependency (macOS)
        if: contains(matrix.target, 'apple-darwin')
        run: |
          otool -L target/${{ matrix.target }}/release/zb
          if otool -L target/${{ matrix.target }}/release/zb | grep -Eq '/opt/homebrew|/usr/local/opt|liblzma'; then
            echo "error: unexpected dynamic dependency detected in release binary"
            exit 1
          fi

      - name: Prepare binaries
        run: |
          cp target/${{ matrix.target }}/release/zb ${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/zbx ${{ matrix.zbx_artifact_name }}

      - name: Upload zb binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

      - name: Upload zbx binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zbx_artifact_name }}
          path: ${{ matrix.zbx_artifact_name }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: "zb*-*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
          # GitHub appends the generated changelog after this, so the install
          # guidance stays at the top where someone landing on the release page
          # will actually read it.
          #
          # The quarantine note matters because these binaries are ad-hoc
          # signed at best and are not notarized. curl does not set
          # com.apple.quarantine, so install.sh and Homebrew are unaffected --
          # only a browser download from this page trips Gatekeeper.
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/HernandoR/zerobrew/main/install.sh | bash
            ```

            This is the recommended route. It picks the right binary for your
            platform, and on Linux it selects the statically linked musl build
            when your glibc is older than 2.35, so `zb` also runs somewhere like
            Google Colab.

            Or with Homebrew, from this fork's tap:

            ```sh
            brew install HernandoR/zerobrew/zerobrew
            ```

            ### Downloading a binary from this page

            The macOS binaries below are not notarized. Installing through
            `install.sh` or Homebrew is unaffected, because `curl` does not mark
            downloads as quarantined. A browser does, so if you download from
            this page directly, clear the flag before running it:

            ```sh
            chmod +x zb zbx
            xattr -d com.apple.quarantine zb zbx 2>/dev/null || true
            ```

            Otherwise macOS refuses to launch it with "cannot be opened because
            the developer cannot be verified".
          # A tag with a pre-release suffix (v0.3.3-rc.1) is published as a
          # pre-release, so `releases/latest` — which install.sh downloads
          # from — keeps pointing at the last stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      # A fine-grained PAT with Contents: read and write on
      # HernandoR/homebrew-zerobrew, and nothing else. The tap is a separate
      # repository because `brew tap <user>/<repo>` resolves only to
      # github.com/<user>/homebrew-<repo>, so GITHUB_TOKEN cannot reach it.
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      TAP_REPO: HernandoR/homebrew-zerobrew
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: "zb*-*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- * > SHA256SUMS

      - name: Generate formula
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_formula.py \
            --version "${GITHUB_REF_NAME#v}" \
            --checksums assets/SHA256SUMS \
            --output zerobrew.rb
          echo "--- generated formula ---"
          cat zerobrew.rb

      - name: Verify the formula is valid Ruby
        run: ruby -c zerobrew.rb

      - name: Push to tap
        run: |
          set -euo pipefail

          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set; skipping the tap update." \
                 "The release itself succeeded -- update ${TAP_REPO} by hand," \
                 "or add the secret so this runs automatically next time."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap

          mkdir -p tap/Formula
          cp zerobrew.rb tap/Formula/zerobrew.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare against the index: a plain `git diff`
          # ignores untracked files, so a tap that does not have the formula
          # yet would look unchanged and never get its first commit.
          git add Formula/zerobrew.rb
          if git diff --cached --quiet -- Formula/zerobrew.rb; then
            echo "Formula already matches ${GITHUB_REF_NAME}; nothing to push."
            exit 0
          fi

          git commit -m "zerobrew ${GITHUB_REF_NAME#v}

          Generated from HernandoR/zerobrew@${GITHUB_SHA} by the release workflow."
          git push
