[package]
name = "zb_net"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
futures-util.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
tokio.workspace = true
tracing.workspace = true
zb_core = { path = "../zb_core" }
zb_store = { path = "../zb_store" }

[features]
android-support = ["reqwest/native-tls"]
# Mock-server builders on `ApiClient`, needed by the installer tests that used
# to live in the same crate as the client itself.
test-util = []

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.1", default-features = false, features = ["json", "stream", "http2"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
