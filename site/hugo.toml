baseURL = "https://hernandor.github.io/zbrew/"
languageCode = "en-us"
title = "zbrew"
enableRobotsTXT = true

# This is a small marketing + docs site: no tags, no categories, no feeds.
disableKinds = ["taxonomy", "term", "rss"]

# The CI workflow uploads ./site/public as the Pages artifact.
publishDir = "public"

[params]
description = "A drop-in, 5-20x faster, experimental Homebrew alternative."
repo = "https://github.com/HernandoR/zbrew"
discord = "https://discord.gg/ZaPYwm9zaw"
installScript = "https://raw.githubusercontent.com/HernandoR/zbrew/main/install.sh"

[[params.nav]]
label = "Install"
href = "/#install"

[[params.nav]]
label = "Docs"
href = "/docs/"

[[params.nav]]
label = "GitHub"
href = "/github/"

[[params.nav]]
label = "Discord"
href = "/discord/"

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

# Class-based output with no Chroma stylesheet: code blocks stay monochrome and
# inherit the site palette from assets/css/pages/docs.css.
[markup.highlight]
noClasses = false
tabWidth = 2

[minify]
disableHTML = false

[minify.tdewolff.html]
keepQuotes = true
